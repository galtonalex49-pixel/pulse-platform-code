<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#00D632" />
<title>Pulse — Invest & Send</title>
<style>
/* ================= TOKENS ================= */
:root{
  --green:#00D632; --green-dk:#00A826; --green-soft:#E7FBEC;
  --ink:#0B0B0B; --muted:#8A8A8E; --line:#EFEFEF;
  --soft:#F6F6F6; --soft-2:#FAFAFA;
  --red:#FF3B30; --red-soft:#FFEDEC;
  --blue:#1E6FD9; --blue-soft:#EAF2FF;
  --r:22px;
  --font:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.25,1);
  --spring:cubic-bezier(.2,1.2,.35,1);
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#E9E9E9;color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.no-scroll{overflow:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;border:none;outline:none;background:none}
h1,h2,h3,h4,p{margin:0;letter-spacing:-.02em;line-height:1.25}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:11.5px}
.center{text-align:center}
.pos{color:var(--green-dk)}
.neg{color:var(--red)}
.up{color:var(--green-dk)}
.down{color:var(--red)}

/* ================= PHONE ================= */
.phone{max-width:480px;margin:0 auto;min-height:100vh;background:#fff;position:relative;padding-bottom:104px;overflow-x:hidden;box-shadow:0 0 80px rgba(0,0,0,.09)}
@media (max-width:480px){.phone{box-shadow:none}}

/* ================= IMPERSONATION BANNER ================= */
.imp-banner{position:sticky;top:0;z-index:35;background:var(--ink);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12.5px;font-weight:700;animation:slideDown .3s var(--spring)}
@keyframes slideDown{from{transform:translateY(-100%)}to{transform:none}}
.imp-banner b{color:var(--green)}
.imp-banner button{background:var(--green);color:#000;padding:7px 12px;border-radius:9px;font-size:12px;font-weight:800;white-space:nowrap;flex-shrink:0}

/* ================= TOPBAR ================= */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:20px 20px 10px;gap:14px}
.topbar .hi{font-size:13px;color:var(--muted);font-weight:600}
.topbar h2{font-size:20px;font-weight:800;letter-spacing:-.03em}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff;font-weight:800;font-size:15px;flex-shrink:0;letter-spacing:-.02em}
.avatar.big{width:62px;height:62px;font-size:22px}
.page-head{display:flex;align-items:center;gap:12px;padding:22px 20px 12px}
.page-head h1{font-size:28px;font-weight:800;letter-spacing:-.04em;flex:1}
.back-btn{width:38px;height:38px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex-shrink:0}
.back-btn:hover{background:#EDEDED}

/* ================= PRICE TICKER ================= */
.ticker{overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--soft-2);margin-bottom:4px;position:relative}
.ticker-track{display:flex;width:max-content;animation:tickerScroll 60s linear infinite}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker-item{display:flex;align-items:center;gap:7px;padding:9px 16px;font-size:12.5px;font-weight:800;white-space:nowrap;border-right:1px solid var(--line);letter-spacing:-.01em}
.ticker-item b{font-variant-numeric:tabular-nums}
.ticker-item .chg{font-size:11.5px;font-weight:800}
@keyframes tickerScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ================= HERO ================= */
.hero{padding:12px 20px 0;animation:rise .5s var(--ease) both}
.hero-label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.hero-value{font-size:46px;font-weight:800;letter-spacing:-.045em;line-height:1.05;margin:6px 0 8px;font-variant-numeric:tabular-nums}
.hero-change{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;font-size:13.5px;font-weight:800;background:var(--green-soft);color:var(--green-dk)}
.hero-change.down{background:var(--red-soft);color:var(--red)}
.spark{width:100%;height:88px;margin-top:14px;display:block;overflow:visible}
.spark path.line{stroke-dasharray:2000;stroke-dashoffset:2000;animation:draw 1.3s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.hero-split{display:flex;gap:24px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.hero-split div span{display:block;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.hero-split div b{font-size:16px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* ================= QUICK ACTIONS ================= */
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:22px 14px 6px;animation:rise .5s .06s var(--ease) both}
.q{display:flex;flex-direction:column;align-items:center;gap:7px;padding:6px 2px;border-radius:16px;transition:transform .15s var(--ease)}
.q:active{transform:scale(.93)}
.q i{width:50px;height:50px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--ink);transition:background .2s}
.q:hover i{background:#EAEAEA}
.q b{font-size:11.5px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.q.green i{background:var(--green);color:#000}
.q.green:hover i{background:var(--green-dk)}

/* ================= SECTIONS ================= */
.section{padding:26px 20px 0;animation:rise .5s var(--ease) both}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sec-head h3{font-size:18px;font-weight:800;letter-spacing:-.03em}
.sec-head button{font-size:13.5px;font-weight:700;color:var(--green-dk)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ================= LIVE FEED ================= */
.feed-list{background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 16px;overflow:hidden}
.feed-item{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;transition:background .15s;border-radius:8px;margin:0 -8px;padding-left:8px;padding-right:8px}
.feed-item:last-child{border-bottom:none}
.feed-item:hover{background:var(--soft-2)}
.feed-item:active{transform:scale(.99)}
.feed-ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.feed-ic.news{background:var(--blue-soft);color:var(--blue)}
.feed-ic.tup{background:var(--green-soft);color:var(--green-dk)}
.feed-ic.tdown{background:var(--red-soft);color:var(--red)}
.feed-body{flex:1;min-width:0}
.feed-body b{display:block;font-size:13.5px;font-weight:800;letter-spacing:-.01em;line-height:1.35;color:var(--ink)}
.feed-body span{display:block;font-size:11.5px;color:var(--muted);font-weight:700;margin-top:3px}
.feed-item.new{animation:feedIn .5s var(--ease)}
@keyframes feedIn{from{opacity:0;transform:translateY(-8px);background:var(--green-soft)}to{opacity:1;transform:none}}

/* ================= TRADE POPUP ================= */
.trade-pop{position:fixed;top:14px;left:50%;transform:translate(-50%,-160%);width:calc(100% - 32px);max-width:448px;z-index:250;background:#0B0B0B;color:#fff;border-radius:18px;padding:12px 15px;display:flex;align-items:center;gap:12px;box-shadow:0 20px 40px -16px rgba(0,0,0,.55);transition:transform .5s var(--spring), opacity .3s;opacity:0;pointer-events:none}
.trade-pop.show{transform:translate(-50%,0);opacity:1}
.trade-pop-ic{width:40px;height:40px;border-radius:50%;background:var(--green);color:#000;display:grid;place-items:center;font-size:18px;font-weight:900;flex-shrink:0}
.trade-pop-ic.down{background:var(--red);color:#fff}
.trade-pop b{display:block;font-size:13.5px;font-weight:800;letter-spacing:-.01em}
.trade-pop span{display:block;font-size:12px;color:#A9A9AE;font-weight:700;margin-top:1px}

/* ================= STOCK ROWS ================= */
.stock-list{display:flex;flex-direction:column}
.stock-row{display:flex;align-items:center;gap:13px;padding:12px 4px;width:100%;border-radius:14px;transition:background .15s}
.stock-row:hover{background:var(--soft-2)}
.stock-logo{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;flex-shrink:0;letter-spacing:-.02em}
.stock-logo.sm{width:36px;height:36px;font-size:14px}
.stock-main{flex:1;min-width:0;text-align:left}
.stock-main b{display:block;font-size:15px;font-weight:800;letter-spacing:-.01em}
.stock-main span{display:block;font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stock-right{text-align:right;flex-shrink:0}
.stock-right b{display:block;font-size:15px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;transition:color .3s}
.stock-right .chg{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
@keyframes flashUp{0%{color:var(--green)}100%{color:var(--ink)}}
@keyframes flashDown{0%{color:var(--red)}100%{color:var(--ink)}}
.flash-up{animation:flashUp .8s ease}
.flash-down{animation:flashDown .8s ease}

/* ================= RATINGS ================= */
.rating{display:inline-block;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.02em;white-space:nowrap}
.rating-strong{background:var(--green);color:#000}
.rating-buy{background:var(--green-soft);color:var(--green-dk)}
.rating-hold{background:var(--soft);color:#666}
.rating-stable{background:var(--blue-soft);color:var(--blue)}

/* ================= HOT SCROLL ================= */
.hot-scroll{display:flex;gap:10px;overflow-x:auto;padding:2px 20px 6px;margin:0 -20px;scrollbar-width:none;scroll-snap-type:x mandatory}
.hot-scroll::-webkit-scrollbar{display:none}
.hot-card{flex:0 0 138px;scroll-snap-align:start;padding:14px;border-radius:18px;background:var(--soft);display:flex;flex-direction:column;gap:3px;align-items:flex-start;transition:transform .18s var(--ease), background .18s;text-align:left}
.hot-card:hover{transform:translateY(-3px);background:#F0F0F0}
.hot-card:active{transform:scale(.97)}
.hot-logo{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;margin-bottom:7px}
.hot-ticker{font-size:13.5px;font-weight:800;letter-spacing:-.01em}
.hot-price{font-size:15px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hot-card .chg{font-size:11.5px;font-weight:700}
.hot-card .rating{margin-top:6px}

/* ================= EMPTY ================= */
.empty{text-align:center;padding:34px 16px;border-radius:20px;background:var(--soft-2);border:1px dashed #E2E2E2}
.empty .big-ic{width:56px;height:56px;border-radius:50%;background:#fff;display:grid;place-items:center;margin:0 auto 12px;box-shadow:0 6px 18px rgba(0,0,0,.06);color:var(--muted)}
.empty b{display:block;font-size:15px;font-weight:800;margin-bottom:3px}
.empty p{font-size:13px;color:var(--muted);margin-bottom:14px}

/* ================= SEARCH ================= */
.search{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:16px;padding:13px 16px;margin:0 0 4px;transition:box-shadow .2s}
.search:focus-within{box-shadow:0 0 0 3px rgba(0,214,50,.16)}
.search svg{color:var(--muted);flex-shrink:0}
.search input{flex:1;font-size:15px;font-weight:600;min-width:0}
.search input::placeholder{color:#B4B4B8;font-weight:600}

/* ================= LIVE BADGE ================= */
.live{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:.04em;color:var(--green-dk);background:var(--green-soft);padding:5px 10px;border-radius:999px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--green);animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* ================= ACTIVITY ================= */
.tx-row{display:flex;align-items:center;gap:13px;padding:12px 4px;border-bottom:1px solid var(--line)}
.tx-row:last-child{border-bottom:none}
.tx-ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;font-weight:800;font-size:18px}
.tx-ic.in{background:var(--green-soft);color:var(--green-dk)}
.tx-ic.out{background:var(--soft);color:var(--ink)}
.tx-ic.neutral{background:var(--blue-soft);color:var(--blue)}
.tx-main{flex:1;min-width:0}
.tx-main b{display:block;font-size:14.5px;font-weight:800;letter-spacing:-.01em}
.tx-main span{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.tx-amt{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ================= SETTINGS ================= */
.profile-card{display:flex;align-items:center;gap:15px;padding:20px;background:var(--soft);border-radius:22px;margin:0 20px}
.profile-card h2{font-size:20px;font-weight:800;letter-spacing:-.03em}
.profile-card p{font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.list{margin:16px 20px 0;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden}
.list button{display:flex;align-items:center;gap:14px;width:100%;padding:17px 18px;border-bottom:1px solid var(--line);text-align:left;font-size:15px;font-weight:700;transition:background .15s}
.list button:last-child{border-bottom:none}
.list button:hover{background:var(--soft-2)}
.list button .ic{width:38px;height:38px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex-shrink:0}
.list button .chev{margin-left:auto;color:#C4C4C8}
.list button.danger{color:var(--red)}
.list button.danger .ic{background:var(--red-soft);color:var(--red)}
.vault-card{margin:18px 20px 0;padding:20px;border-radius:22px;background:linear-gradient(135deg,#0B0B0B,#232323);color:#fff;display:flex;align-items:center;gap:15px;transition:transform .22s var(--ease), box-shadow .22s;position:relative;overflow:hidden}
.vault-card::after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle, rgba(0,214,50,.35), transparent 70%);top:-90px;right:-50px;pointer-events:none}
.vault-card:hover{transform:translateY(-3px);box-shadow:0 22px 44px -20px rgba(0,0,0,.55)}
.vault-card .vic{width:48px;height:48px;border-radius:15px;background:var(--green);color:#000;display:grid;place-items:center;flex-shrink:0}
.vault-card b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em}
.vault-card p{font-size:12.5px;color:#A9A9AE;margin-top:2px;font-weight:600}
.vault-card .arrow{margin-left:auto;color:#8A8A8E;flex-shrink:0}

/* ================= VAULT ================= */
.vault-section{padding:20px}
.vault-section h3{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.vault-user{border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:11px;background:#fff}
.vault-user-head{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.vault-user-head b{display:block;font-size:15px;font-weight:800}
.vault-user-head span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.seed-badge{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.06em;background:var(--blue-soft);color:var(--blue);padding:2px 6px;border-radius:5px;margin-left:5px;vertical-align:middle;text-transform:uppercase}
.vault-user label{display:block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;margin-top:10px}
.vault-user input{width:100%;padding:11px 13px;border-radius:11px;background:var(--soft);font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;border:1px solid transparent;transition:border-color .2s}
.vault-user input[type="text"]{font-weight:600;font-size:13px}
.vault-user input:focus{border-color:var(--green);background:#fff}
.vault-user-actions{display:flex;gap:7px;margin-top:12px}
.vault-user-actions button{flex:1;padding:9px 4px;border-radius:10px;font-size:12px;font-weight:800;background:var(--soft);transition:background .15s}
.vault-user-actions button:hover{background:#EDEDED}
.vault-user-actions button.danger{background:var(--red-soft);color:var(--red)}
.vault-user-actions button.danger:hover{background:#FFE0DE}
.vault-stock{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.vault-stock:last-child{border-bottom:none}
.vault-stock b{font-size:14.5px;font-weight:800;flex:1}
.vault-stock input{width:120px;padding:9px 12px;border-radius:10px;background:var(--soft);font-size:14px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums;border:1px solid transparent}
.vault-stock input:focus{border-color:var(--green);background:#fff}
.vault-danger{margin:8px 20px 0;padding:16px;border-radius:18px;border:1px solid var(--red-soft);background:#FFF8F8}
.vault-danger b{display:block;font-size:14.5px;font-weight:800;margin-bottom:3px}
.vault-danger p{font-size:12.5px;color:var(--muted);margin-bottom:12px;font-weight:600}
.btn-danger{width:100%;padding:13px;border-radius:13px;background:var(--red);color:#fff;font-size:14px;font-weight:800}
.btn-danger:active{transform:scale(.98)}

/* ================= HOLDINGS EDITOR ================= */
.holding-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.holding-row:last-child{border-bottom:none}
.holding-row input{width:92px;padding:9px 10px;border-radius:10px;background:var(--soft);font-size:13px;font-weight:800;text-align:right;border:1px solid transparent;font-variant-numeric:tabular-nums}
.holding-row input:focus{border-color:var(--green);background:#fff}
.holding-main{flex:1;min-width:0}
.holding-main b{display:block;font-size:14px;font-weight:800}
.holding-main span{display:block;font-size:11.5px;color:var(--muted);font-weight:700}
.hx{width:28px;height:28px;border-radius:50%;background:var(--red-soft);color:var(--red);display:grid;place-items:center;font-size:17px;font-weight:800;flex-shrink:0}
.hx:hover{background:#FFE0DE}

/* ================= BUTTONS ================= */
.btn-primary{width:100%;padding:16px;border-radius:16px;background:var(--green);color:#000;font-size:16px;font-weight:800;letter-spacing:-.01em;transition:transform .15s var(--ease), background .2s;display:flex;align-items:center;justify-content:center;gap:9px}
.btn-primary:hover{background:var(--green-dk)}
.btn-primary:active{transform:scale(.975)}
.btn-primary:disabled{opacity:.6;cursor:default;transform:none}
.btn-ghost{width:100%;padding:16px;border-radius:16px;background:var(--soft);color:var(--ink);font-size:16px;font-weight:800;transition:background .15s, transform .15s;display:flex;align-items:center;justify-content:center;gap:9px}
.btn-ghost:hover{background:#EDEDED}
.btn-ghost:active{transform:scale(.975)}
.btn-big{padding:17px}

/* ================= TAB BAR ================= */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--line);display:flex;padding:9px 8px calc(9px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;color:#A0A0A4;font-size:10.5px;font-weight:800;letter-spacing:.01em;transition:color .2s}
.tab.on{color:var(--ink)}
.tab svg{transition:transform .25s var(--spring)}
.tab.on svg{transform:translateY(-2px) scale(1.06)}

/* ================= SHEETS ================= */
.sheet-backdrop{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .22s ease both;backdrop-filter:blur(2px)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:480px;background:#fff;border-radius:28px 28px 0 0;padding:10px 20px 30px;max-height:90vh;overflow-y:auto;overscroll-behavior:contain;animation:slideUp .38s var(--spring) both;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet::-webkit-scrollbar{display:none}
.sheet-grab{width:40px;height:4.5px;border-radius:99px;background:#E2E2E6;margin:0 auto 16px}
.sheet-head{display:flex;align-items:center;gap:11px;margin-bottom:16px}
.sheet-head h2{font-size:21px;font-weight:800;letter-spacing:-.035em;flex:1}
.sheet-close{width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:19px;color:var(--ink);flex-shrink:0;transition:background .15s}
.sheet-close:hover{background:#E8E8E8}
.sheet-back{width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex-shrink:0;transition:background .15s}
.sheet-back:hover{background:#E8E8E8}
.sheet-sub{font-size:13.5px;color:var(--muted);font-weight:600;margin-bottom:18px}
.section-label{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:20px 0 10px}

/* ================= METHOD PICKER ================= */
.method-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 4px}
.method-btn{display:flex;align-items:center;gap:10px;padding:14px;border-radius:15px;background:var(--soft);border:1.5px solid transparent;font-size:13.5px;font-weight:800;text-align:left;transition:all .15s;color:var(--ink)}
.method-btn:hover{background:#EAEAEA;border-color:#E0E0E4}
.method-btn:active{transform:scale(.97)}
.method-btn .m-ic{width:36px;height:36px;border-radius:11px;background:#fff;display:grid;place-items:center;font-size:16px;font-weight:900;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.06);color:var(--ink)}

/* ================= AMOUNT INPUT ================= */
.amount-stock{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.amount-stock b{display:block;font-size:15px;font-weight:800}
.amount-stock span{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.amount-display{display:flex;align-items:center;justify-content:center;gap:4px;padding:10px 0 4px}
.amount-display > span{font-size:44px;font-weight:800;letter-spacing:-.05em;color:#C8C8CC}
.amount-display input{width:100%;text-align:center;font-size:56px;font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums;padding:0}
.amount-display input::placeholder{color:#DADADE}
.amount-display.centered input{font-size:34px;letter-spacing:.3em;text-align:center}
.amount-hint{text-align:center;font-size:13.5px;color:var(--muted);font-weight:600;margin-bottom:18px}
.amount-hint b{color:var(--ink);font-weight:800}
.quick-amounts{display:flex;gap:8px;margin-bottom:22px}
.quick-amounts button{flex:1;padding:11px 4px;border-radius:12px;background:var(--soft);font-size:13px;font-weight:800;transition:background .15s}
.quick-amounts button:hover{background:#E9E9E9}
.quick-amounts button:active{transform:scale(.96)}
.balance-hint{text-align:center;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:14px}

/* ================= FORM FIELDS ================= */
.field-label{display:block;font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 7px}
.field-input{width:100%;padding:15px 16px;border-radius:14px;background:var(--soft);font-size:16px;font-weight:700;border:1.5px solid transparent;transition:border-color .2s, background .2s;appearance:none;-webkit-appearance:none}
.field-input:focus{border-color:var(--green);background:#fff}
.field-input::placeholder{color:#B4B4B8;font-weight:600}

/* ================= PROCESSING / SUCCESS / ERROR ================= */
.processing{padding:40px 0 30px;text-align:center}
.spinner{width:44px;height:44px;border-radius:50%;margin:0 auto 20px;border:4px solid var(--soft);border-top-color:var(--green);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.processing h2{font-size:21px;font-weight:800;letter-spacing:-.03em;margin-bottom:5px}
.processing p{font-size:13.5px;color:var(--muted);font-weight:600}
.success{text-align:center;padding:26px 0 10px}
.success-check{width:84px;height:84px;border-radius:50%;background:var(--green);display:grid;place-items:center;margin:0 auto 22px;animation:pop .55s var(--spring) both;box-shadow:0 16px 36px -12px rgba(0,214,50,.65);color:#000}
@keyframes pop{0%{transform:scale(0) rotate(-40deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.success h2{font-size:24px;font-weight:800;letter-spacing:-.035em;margin-bottom:7px}
.success p{font-size:14.5px;color:var(--muted);font-weight:600;line-height:1.5;margin-bottom:26px}
.error-state{text-align:center;padding:26px 0 10px}
.error-x{width:84px;height:84px;border-radius:50%;background:var(--red-soft);color:var(--red);display:grid;place-items:center;margin:0 auto 20px;animation:pop .5s var(--spring) both;font-size:36px;font-weight:900}
.error-state h2{font-size:22px;font-weight:800;letter-spacing:-.035em;margin-bottom:8px}
.error-state p{font-size:14px;color:var(--muted);font-weight:600;line-height:1.55;margin-bottom:24px;padding:0 6px}
.shake{animation:shake .4s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(6px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}

/* ================= RECEIVE ================= */
.receive-card{background:var(--soft);border-radius:20px;padding:22px;text-align:center;margin-bottom:18px}
.receive-handle{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:10px 0 4px}
.receive-card p{font-size:13px;color:var(--muted);font-weight:600}

/* ================= AUTH ================= */
.auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:44px 26px;position:relative;overflow:hidden;background:#fff;max-width:480px;margin:0 auto}
.auth::before{content:'';position:absolute;top:-200px;left:50%;transform:translateX(-50%);width:480px;height:480px;border-radius:50%;pointer-events:none;background:radial-gradient(circle, rgba(0,214,50,.20), transparent 68%);filter:blur(14px)}
.auth::after{content:'';position:absolute;bottom:-180px;right:-120px;width:380px;height:380px;border-radius:50%;pointer-events:none;background:radial-gradient(circle, rgba(0,214,50,.10), transparent 70%)}
.auth-inner{position:relative;z-index:1;animation:rise .6s var(--ease) both}
.brand{text-align:center;margin-bottom:32px}
.brand-mark{width:74px;height:74px;border-radius:22px;margin:0 auto 16px;background:var(--green);color:#000;display:grid;place-items:center;font-size:34px;font-weight:900;letter-spacing:-.04em;box-shadow:0 18px 40px -14px rgba(0,214,50,.65);animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.brand h1{font-size:34px;font-weight:900;letter-spacing:-.05em}
.brand p{font-size:14.5px;color:var(--muted);font-weight:600;margin-top:5px}
.auth-tabs{display:flex;gap:4px;padding:4px;border-radius:15px;background:var(--soft);margin-bottom:22px}
.auth-tabs button{flex:1;padding:12px;border-radius:12px;font-size:14.5px;font-weight:800;color:var(--muted);transition:all .2s var(--ease)}
.auth-tabs button.on{background:#fff;color:var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.08)}
.auth-form label{display:block;font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}
.auth-form input{width:100%;padding:16px;border-radius:15px;background:var(--soft);font-size:16px;font-weight:700;margin-bottom:16px;border:1.5px solid transparent;transition:border-color .2s, background .2s}
.auth-form input:focus{border-color:var(--green);background:#fff}
.auth-form input::placeholder{color:#B4B4B8;font-weight:600}
.auth-err{color:var(--red);font-size:13.5px;font-weight:700;min-height:18px;margin:-6px 0 10px}
.auth-note{text-align:center;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:18px}

/* ================= TOAST ================= */
.toast{position:fixed;left:50%;bottom:120px;transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:13px 22px;border-radius:14px;font-size:13.5px;font-weight:700;z-index:300;opacity:0;transition:all .3s var(--spring);pointer-events:none;max-width:88vw;text-align:center;box-shadow:0 14px 30px -10px rgba(0,0,0,.45)}
.toast.show{opacity:1;transform:translate(-50%,0)}

.spacer{height:8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}}
</style>

/* ============================================================

   ============================================================ */
const USERS_KEY   = 'pulse_users_v1';
const SESSION_KEY = 'pulse_session_v1';
 const STOCKS_KEY  = 'pulse_stocks_v1';
 const VAULT_KEY   = 'pulse_vault_unlocked_v1';
const IMP_KEY     = 'pulse_admin_return';
const ADMIN_CODE  = '2002';
const START_CASH  = 10000;

const DEFAULT_WITHDRAWAL_ERROR =
  'We couldn\'t verify your payment details. Please check your information and try again, or contact support.';

const DEFAULT_STOCKS = [
  { t:'AAPL',  n:'Apple Inc.',       p:227.52,  rating:'Strong Buy', sector:'Technology',     color:'#1D1D1F' },

  { t:'MSFT',  n:'Microsoft Corp.',  p:428.90,  rating:'Strong Buy', sector:'Technology',     color:'#0078D4' },

/* --- payment methods --- */

/* ============================================================
   2. STORAGE
   ============================================================ */
function loadJSON(k, fb){
  try{ const r = localStorage.getItem(k); return r ? JSON.parse(r) : fb; }
  catch(e){ return fb; }
}
function saveJSON(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

const NF2 = new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2});
function money(n){ return NF2.format(Number(n) || 0); }
function moneySigned(n){ return (n >= 0 ? '+' : '−') + NF2.format(Math.abs(Number(n) || 0)); }
function fmtShares(n){ return (Math.round(n * 10000) / 10000).toLocaleString('en-US', { maximumFractionDigits: 4 }); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function uid(){ return Math.random().toString(36).slice(2, 10); }
function hashPass(p){
  let h = 0;
  for(let i = 0; i < p.length; i++){ h = ((h << 5) - h) + p.charCodeAt(i); h |= 0; }
  return 'h' + Math.abs(h).toString(36) + '_' + p.length;
}
function rand(n){ const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function hashStr(s){ let h = 0; for(let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }
function fmtDate(ts){
  const d = new Date(ts), now = new Date();
  const time = d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
  if(d.toDateString() === now.toDateString()) return 'Today, ' + time;
  const y = new Date(now); y.setDate(y.getDate() - 1);
  if(d.toDateString() === y.toDateString()) return 'Yesterday, ' + time;
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric' }) + ', ' + time;
}
function timeAgo(ts){
  const s = Math.floor((Date.now() - ts) / 1000);
  if(s < 10) return 'just now';
  if(s < 60) return s + 's ago';
  if(s < 3600) return Math.floor(s / 60) + 'm ago';
  return Math.floor(s / 3600) + 'h ago';
}
function greeting(){
  const h = new Date().getHours();
  if(h < 12) return 'Good morning';
  if(h < 18) return 'Good afternoon';
  return 'Good evening';
}

function seedUser(balance, holdingsArr, createdAt){
  const holdings = {};
  holdingsArr.forEach(([t, shares, avg]) => { holdings[t] = { shares, avg }; });
  return {
    password: hashPass('demo1234'),
    balance,
    holdings,
    transactions: [{ id: uid(), type:'deposit', name:'Initial deposit', amount: balance, date: createdAt }],
    createdAt,
    withdrawalError: DEFAULT_WITHDRAWAL_ERROR,
    isSeed: true
  };
}

/* ============================================================
   4. LOAD STATE
   ============================================================ */
let users = loadJSON(USERS_KEY, null);
let stocks = loadJSON(STOCKS_KEY, null);
let currentUser = sessionStorage.getItem(SESSION_KEY);
let vaultUnlocked = sessionStorage.getItem(VAULT_KEY) === '1';
let page = 'home';
let authMode = 'signup';
let sparkSeq = 0;
let feed = [];
let pendingWithdraw = null;
let pendingDeposit = null;
let currentPop = null;

if(!users){
  users = JSON.parse(JSON.stringify(SEED_USERS));
  saveJSON(USERS_KEY, users);
} else {
  /* migrate old accounts */
  Object.keys(users).forEach(n => {
    if(!users[n].withdrawalError) users[n].withdrawalError = DEFAULT_WITHDRAWAL_ERROR;
    if(!Array.isArray(users[n].transactions)) users[n].transactions = [];
    if(!users[n].holdings) users[n].holdings = {};
    if(users[n].balance == null) users[n].balance = 0;
  });
  /* if only seeds exist (fresh) — reseed is not needed */
  if(Object.keys(users).length === 0){
    users = JSON.parse(JSON.stringify(SEED_USERS));
    saveJSON(USERS_KEY, users);
  }
}

if(!stocks){
  stocks = DEFAULT_STOCKS.map(s => Object.assign({}, s, { base: s.p }));
  saveJSON(STOCKS_KEY, stocks);
}

if(currentUser && !users[currentUser]){
  currentUser = null;
  sessionStorage.removeItem(SESSION_KEY);
}

function saveUsers(){ saveJSON(USERS_KEY, users); }
function saveStocks(){ saveJSON(STOCKS_KEY, stocks); }
function stockByTicker(t){ return stocks.find(s => s.t === t); }

/* ============================================================
   5. PORTFOLIO MATH
   ============================================================ */
function holdingsValue(u){
  let v = 0;
  for(const t in u.holdings){
    const s = stockByTicker(t);
    if(s) v += u.holdings[t].shares * s.p;
  }
  return v;
}
function portfolioValue(u){ return Number(u.balance) + holdingsValue(u); }
function dayChange(u){
  let amount = 0;
  for(const t in u.holdings){
    const s = stockByTicker(t);
    if(!s) continue;
    amount += u.holdings[t].shares * (s.p - s.base);
  }
  const pv = portfolioValue(u);
  const prev = pv - amount;
  const pct = prev > 0 ? (amount / prev) * 100 : 0;
  return { amount, pct };
}
function trimTransactions(u){ if(u.transactions.length > 60) u.transactions = u.transactions.slice(0, 60); }

/* ============================================================
   6. SPARKLINE
   ============================================================ */
function sparkSVG(vals, color){
  const id = 'sg' + (++sparkSeq);
  const w = 300, h = 90;
  const min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  const range = (max - min) || 1;
  const pts = vals.map((v, i) => [(i / (vals.length - 1)) * w, h - 6 - ((v - min) / range) * (h - 18)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = line + ' L ' + w + ' ' + h + ' L 0 ' + h + ' Z';
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" class="spark">'
    + '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0%" stop-color="' + color + '" stop-opacity=".22"/>'
    + '<stop offset="100%" stop-color="' + color + '" stop-opacity="0"/>'
    + '</linearGradient></defs>'
    + '<path d="' + area + '" fill="url(#' + id + ')"/>'
    + '<path class="line" d="' + line + '" fill="none" stroke="' + color + '" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'
    + '</svg>';
}
function portfolioSpark(u){
  const pv = portfolioValue(u);
  const N = 32;
  const seed = hashStr(currentUser || 'pulse') || 7;
  const raw = [];
  let cum = 0;
  for(let i = 0; i < N; i++){ cum += (rand(seed * 13 + i * 7) - 0.47) * 0.024; raw.push(cum); }
  const last = raw[N - 1];
  const vals = raw.map(r => Math.max(0.01, pv * (1 + (r - last))));
  vals[N - 1] = pv;
  return sparkSVG(vals, '#00D632');
}

const NEWS_SOURCES = ['Bloomberg','Reuters','CNBC','MarketWatch','Barron\'s','The Street'];
const NEWS_TEMPLATES = [
  (s, pct) => s.n + ' ' + (pct >= 0 ? 'surges' : 'slides') + ' ' + Math.abs(pct).toFixed(1) + '% in today\'s session',
  (s) => 'Analysts raise ' + s.t + ' price target after strong guidance',

  (s) => 'Institutional investors increase stake in ' + s.t,
  (s) => s.sector + ' sector rallies as markets open higher',
  (s) => 'Breaking: ' + s.n + ' announces new strategic partnership',

];

function addFeed(item){
  feed.unshift(Object.assign({ id: uid(), time: Date.now() }, item));
  feed = feed.slice(0, 14);
  renderFeed();
}

function genNews(){
  const s = stocks[Math.floor(Math.random() * stocks.length)];
  const chg = (s.p - s.base) / s.base * 100;
  const tmpl = NEWS_TEMPLATES[Math.floor(Math.random() * NEWS_TEMPLATES.length)];
  addFeed({
    type:'news',
    sentiment: chg >= 0 ? 'up' : 'down',
    ticker: s.t,
    text: tmpl(s, chg),
    source: NEWS_SOURCES[Math.floor(Math.random() * NEWS_SOURCES.length)]
  });
}

function seedTrade(){
  const seedNames = Object.keys(users).filter(n => users[n].isSeed);
  if(!seedNames.length) return;
  const name = seedNames[Math.floor(Math.random() * seedNames.length)];
  const u = users[name];
  if(!u) return;
  const s = stocks[Math.floor(Math.random() * stocks.length)];
  if(!s) return;

  const big = Math.random() < 0.35;
  const budget = big ? (5000 + Math.random() * 40000) : (100 + Math.random() * 2200);
  const canAfford = u.balance >= budget;
  const hasShares = u.holdings[s.t] && u.holdings[s.t].shares > 0;

  let type;
  if(hasShares && (!canAfford || Math.random() < 0.4)) type = 'sell';
  else if(canAfford) type = 'buy';
  else return;

  if(type === 'buy'){
    const shares = budget / s.p;
    u.balance -= budget;
    const h = u.holdings[s.t] || { shares:0, avg:0 };
    const total = h.shares + shares;
    h.avg = ((h.shares * h.avg) + budget) / total;
    h.shares = total;
    u.holdings[s.t] = h;
    u.transactions.unshift({ id: uid(), type:'buy', ticker:s.t, name:s.n, amount:-budget, shares, price:s.p, date: Date.now() });
    trimTransactions(u);
    addFeed({ type:'trade', sentiment:'up', ticker:s.t, text:'@' + name + ' bought ' + fmtShares(shares) + ' ' + s.t, value: budget, user: name });
    if(big) showTradePop(name, 'bought', s.t, budget, 'up');
  } else {
    const h = u.holdings[s.t];
    const sellShares = Math.min(h.shares, budget / s.p);
    const value = sellShares * s.p;
    h.shares -= sellShares;
    if(h.shares < 0.000001) delete u.holdings[s.t];
    u.balance += value;
    u.transactions.unshift({ id: uid(), type:'sell', ticker:s.t, name:s.n, amount:value, shares:sellShares, price:s.p, date: Date.now() });
    trimTransactions(u);
    addFeed({ type:'trade', sentiment:'down', ticker:s.t, text:'@' + name + ' sold ' + fmtShares(sellShares) + ' ' + s.t, value, user: name });
    if(big) showTradePop(name, 'sold', s.t, value, 'down');
  }
  saveUsers();
}

  if(!currentUser || page !== 'home' || sheetRoot.querySelector('.sheet')) return;
  if(currentPop){ currentPop.remove(); currentPop = null; }
  const el = document.createElement('div');
  el.className = 'trade-pop';
  el.innerHTML = '<div class="trade-pop-ic ' + (dir === 'down' ? 'down' : '') + '">' + (dir === 'down' ? '↓' : '↑') + '</div>'
    + '<div><b>@' + esc(user) + ' just ' + action + ' ' + esc(ticker) + '</b>'

/* ============================================================
   13. LIVE PAINT
   ============================================================ */
function flash(el, dir){
  if(el.closest('.ticker')) return;
  el.classList.remove('flash-up','flash-down');
  void el.offsetWidth;
  el.classList.add(dir === 'up' ? 'flash-up' : 'flash-down');
  setTimeout(() => el.classList.remove('flash-up','flash-down'), 820);
}

function paintLive(){
  if(!currentUser) return;
  const u = users[currentUser];
  if(!u) return;

  document.querySelectorAll('[data-live]').forEach(el => {
    const s = stockByTicker(el.dataset.live);
    if(!s) return;
    const prev = parseFloat(el.dataset.prev || s.p);
    const txt = money(s.p);
    if(el.textContent !== txt){
      el.textContent = txt;
      if(Math.abs(s.p - prev) > 0.00001) flash(el, s.p > prev ? 'up' : 'down');
    }
    el.dataset.prev = s.p;
  });

  document.querySelectorAll('[data-chg]').forEach(el => {
    const s = stockByTicker(el.dataset.chg);
    if(!s) return;
    const chg = (s.p - s.base) / s.base * 100;
    el.textContent = (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%';
    el.classList.toggle('up', chg >= 0);
    el.classList.toggle('down', chg < 0);
  });

  const pv = portfolioValue(u);
  document.querySelectorAll('[data-portfolio]').forEach(el => { el.textContent = money(pv); });

  const dc = dayChange(u);
  document.querySelectorAll('[data-daychange]').forEach(el => {
    el.textContent = (dc.amount >= 0 ? '+' : '−') + money(Math.abs(dc.amount)) + ' (' + (dc.pct >= 0 ? '+' : '') + dc.pct.toFixed(2) + '%) today';
    el.classList.toggle('down', dc.amount < 0);
  });

  document.querySelectorAll('[data-cash]').forEach(el => { el.textContent = money(u.balance); });
  document.querySelectorAll('[data-invested]').forEach(el => { el.textContent = money(holdingsValue(u)); });

  document.querySelectorAll('[data-holdval]').forEach(el => {
    const t = el.dataset.holdval;
    const h = u.holdings[t];
    const s = stockByTicker(t);
    if(!h || !s) return;
    el.textContent = money(h.shares * s.p);
  });
}

/* ============================================================
   14. TRADE EXECUTION
   ============================================================ */
function executeBuy(t, amount){
  const u = users[currentUser];
  const s = stockByTicker(t);
  if(!s) return { error: 'Stock not found' };
  if(!(amount > 0)) return { error: 'Enter a valid amount' };
  if(amount > u.balance + 0.0001) return { error: 'Insufficient cash balance' };
  const shares = amount / s.p;
  u.balance -= amount;
  const h = u.holdings[t] || { shares:0, avg:0 };
  const total = h.shares + shares;
  h.avg = ((h.shares * h.avg) + amount) / total;
  h.shares = total;
  u.holdings[t] = h;
  u.transactions.unshift({ id: uid(), type:'buy', ticker:t, name:s.n, amount:-amount, shares, price:s.p, date: Date.now() });
  trimTransactions(u);
  saveUsers();
  return { shares };
}
function executeSell(t, amount){
  const u = users[currentUser];
  const s = stockByTicker(t);
  const h = u.holdings[t];
  if(!s || !h || h.shares <= 0) return { error: 'You don\'t own this stock' };
  const maxValue = h.shares * s.p;
  if(amount > maxValue + 0.01) return { error: 'Not enough shares' };
  const shares = amount / s.p;
  h.shares = Math.max(0, h.shares - shares);
  if(h.shares < 0.000001) delete u.holdings[t];
  u.balance += amount;
  u.transactions.unshift({ id: uid(), type:'sell', ticker:t, name:s.n, amount, shares, price:s.p, date: Date.now() });
  trimTransactions(u);
  saveUsers();
  return { shares };
}
function executeSend(to, amount){
  const u = users[currentUser];
  if(!users[to]) return { error: 'No account found for @' + to };
  if(to === currentUser) return { error: 'You can\'t send to yourself' };
  if(!(amount > 0)) return { error: 'Enter a valid amount' };
  if(amount > u.balance + 0.0001) return { error: 'Insufficient cash balance' };
  u.balance -= amount;
  users[to].balance += amount;
  u.transactions.unshift({ id: uid(), type:'send', name:'@' + to, amount:-amount, date: Date.now() });
  users[to].transactions.unshift({ id: uid(), type:'receive', name:'@' + currentUser, amount, date: Date.now() });
  trimTransactions(u); trimTransactions(users[to]);
  saveUsers();
  return {};
}
function executeDeposit(amount){
  const u = users[currentUser];
  if(!(amount > 0)) return { error: 'Enter a valid amount' };
  u.balance += amount;
  u.transactions.unshift({ id: uid(), type:'deposit', name:'Bank transfer', amount, date: Date.now() });
  trimTransactions(u);
  saveUsers();
  return {};
}

      + '<h2>Withdrawal rejected</h2>'
      + '<p>' + esc(err) + '</p>'
      + '<button class="btn-ghost btn-big" data-close-to-home>Back to home</button>'
      + '</div>'
    );
  }, 2800);
}

/* -------- VAULT GATE -------- */
function openVaultGate(){
  if(vaultUnlocked){ page = 'vault'; render(); window.scrollTo(0, 0); return; }
  openSheet(
    sheetHeader('Vault')
    + '<p class="sheet-sub">Enter the 4-digit admin code to continue.</p>'
    + '<div class="amount-display centered"><input id="vault-code" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off"></div>'
    + '<div class="auth-err center" id="vault-err"></div>'
    + '<button class="btn-primary btn-big" data-confirm-vault>Unlock vault</button>'
    + '<p class="balance-hint">Restricted access · admins only</p>'
  );
  const el = document.getElementById('vault-code');
  if(el) setTimeout(() => el.focus(), 150);
}

/* -------- ADMIN PORTFOLIO EDITOR -------- */
function openAdminHoldings(name){
  const u = users[name];
  if(!u) return;
  const held = Object.keys(u.holdings).filter(t => u.holdings[t].shares > 0);
  const notHeld = stocks.filter(s => !held.includes(s.t));

  let holdingsHTML = '';
  if(held.length){
    holdingsHTML = held.map(t => {
      const s = stockByTicker(t);
      const h = u.holdings[t];
      if(!s) return '';
      return '<div class="holding-row">'
        + '<span class="stock-logo sm" style="background:' + s.color + '">' + esc(t[0]) + '</span>'
        + '<div class="holding-main"><b>' + esc(t) + '</b><span>' + money(s.p) + ' · ' + esc(s.n) + '</span></div>'
        + '<input type="number" step="0.0001" min="0" data-hold-shares="' + esc(name) + ':' + esc(t) + '" value="' + Number(h.shares).toFixed(4) + '">'
        + '<button class="hx" data-hold-remove="' + esc(name) + ':' + esc(t) + '">×</button></div>';
    }).join('');
  } else {
    holdingsHTML = '<p class="muted small" style="padding:8px 0">No holdings</p>';
  }

  openSheet(
    sheetHeader('Portfolio · @' + esc(name))
    + '<div class="amount-stock" style="margin-bottom:10px">'
    +   '<div style="flex:1"><b>Cash</b><span>' + money(u.balance) + '</span></div>'
    +   '<div style="text-align:right"><b>Total</b><span>' + money(portfolioValue(u)) + '</span></div></div>'
    + '<div class="section-label">Holdings</div>'
    + holdingsHTML
    + '<div class="section-label">Add holding</div>'
    + '<div style="display:flex;gap:8px;align-items:stretch">'
    +   '<select id="add-hold-ticker" class="field-input" style="flex:1;padding:12px 14px;font-size:14px">'
    +     notHeld.map(s => '<option value="' + s.t + '">' + s.t + ' — ' + esc(s.n) + '</option>').join('')
    +   '</select>'
    +   '<input id="add-hold-shares" type="number" step="0.0001" min="0" placeholder="Shares" class="field-input" style="width:105px;padding:12px;font-size:14px">'
    +   '<button class="btn-primary" style="width:auto;padding:0 18px;flex-shrink:0" data-hold-add="' + esc(name) + '">+</button>'
    + '</div>'
    + '<button class="btn-ghost btn-big" style="margin-top:22px" data-close>Done</button>'
  );
}

/* ============================================================
   16. EVENT DELEGATION
   ============================================================ */
document.addEventListener('click', e => {
  /* auth */
  const tab = e.target.closest('[data-auth-tab]');
  if(tab){ switchAuthMode(tab.dataset.authTab); return; }

  if(e.target.closest('#auth-submit')){
    const userEl = document.getElementById('auth-user');
    const passEl = document.getElementById('auth-pass');
    const errEl  = document.getElementById('auth-err');
    const name = (userEl.value || '').trim().toLowerCase().replace(/\s+/g, '');
    const pass = passEl.value || '';

    if(!/^[a-z0-9_]{3,20}$/.test(name)){
      errEl.textContent = 'Username: 3–20 chars, letters, numbers or _';
      userEl.classList.add('shake');
      setTimeout(() => userEl.classList.remove('shake'), 420);
      return;
    }
    if(pass.length < 4){
      errEl.textContent = 'Password must be at least 4 characters';
      passEl.classList.add('shake');
      setTimeout(() => passEl.classList.remove('shake'), 420);
      return;
    }
    if(authMode === 'signup'){
      if(users[name]){ errEl.textContent = 'That username is already taken'; return; }
      users[name] = newUser(pass);
      saveUsers();
      signIn(name);
    } else {
      if(!users[name]){ errEl.textContent = 'No account found for @' + name; return; }
      if(users[name].password !== hashPass(pass)){
        errEl.textContent = 'Incorrect password';
        passEl.classList.add('shake');
        setTimeout(() => passEl.classList.remove('shake'), 420);
        return;
      }
      signIn(name);
    }
    return;
  }

  /* nav */
  const nav = e.target.closest('[data-nav]');
  if(nav){ page = nav.dataset.nav; closeSheet(); render(); window.scrollTo(0, 0); return; }

  /* actions */
  const act = e.target.closest('[data-action]');
  if(act){
    const a = act.dataset.action;
    if(a === 'buy'){ openBuyPicker(); return; }
    if(a === 'deposit'){ pendingDeposit = null; openDeposit(); return; }
    if(a === 'withdraw'){ pendingWithdraw = null; openWithdraw(); return; }
    if(a === 'send'){ openSend(); return; }
    if(a === 'receive'){ openReceive(); return; }
    if(a === 'vault'){ openVaultGate(); return; }
    if(a === 'signout'){ signOut(); return; }
    if(a === 'account'){ toast('Account details — coming soon'); return; }
    if(a === 'security'){ toast('Security settings — coming soon'); return; }
    if(a === 'notifications'){ toast('You have no new notifications'); return; }
    if(a === 'reset-all'){ resetAllData(); return; }
    if(a === 'return-admin'){
      const from = sessionStorage.getItem(IMP_KEY);
      if(from && users[from]){
        currentUser = from;
        sessionStorage.setItem(SESSION_KEY, from);
        sessionStorage.removeItem(IMP_KEY);
        page = 'vault';
        render();
        window.scrollTo(0, 0);
        toast('Back to admin');
      }
      return;
    }
  }

  /* stock detail */
  const stockEl = e.target.closest('[data-stock]');
  if(stockEl){ openStockDetail(stockEl.dataset.stock); return; }

  /* buy picker hot cards */
  const pick = e.target.closest('[data-buy-pick]');
  if(pick){ openBuyAmount(pick.dataset.buyPick); return; }

  /* back to buy picker */
  if(e.target.closest('[data-buy-picker]')){ openBuyPicker(); return; }

  /* back to stock detail */
  const sd = e.target.closest('[data-stock-detail]');
  if(sd){ openStockDetail(sd.dataset.stockDetail); return; }

  /* buy / sell from detail */
  const buyBtn = e.target.closest('[data-buy]');
  if(buyBtn){ openBuyAmount(buyBtn.dataset.buy); return; }
  const sellBtn = e.target.closest('[data-sell]');
  if(sellBtn){ openSellAmount(sellBtn.dataset.sell); return; }

  /* quick amounts */
  const qa = e.target.closest('[data-quick-amt]');
  if(qa){
    const val = parseFloat(qa.dataset.quickAmt);
    const input = document.getElementById('buy-amount')
      || document.getElementById('sell-amount')
      || document.getElementById('send-amount')
      || document.getElementById('dep-amount')
      || document.getElementById('wd-amount')
      || document.getElementById('req-amount');
    if(input && !isNaN(val)){
      input.value = val.toFixed(2);
      input.dispatchEvent(new Event('input', { bubbles: true }));
    }
    return;
  }

  /* confirm buy */
  const cBuy = e.target.closest('[data-confirm-buy]');
  if(cBuy){
    const t = cBuy.dataset.confirmBuy;
    const input = document.getElementById('buy-amount');
    const amount = parseFloat(input.value || '0');
    const u = users[currentUser];
    if(!amount || amount <= 0){ input.classList.add('shake'); setTimeout(() => input.classList.remove('shake'), 420); return; }
    if(amount > u.balance){ toast('Insufficient cash balance'); input.classList.add('shake'); setTimeout(() => input.classList.remove('shake'), 420); return; }
    showProcessing('Buying ' + t + '…');
    setTimeout(() => {
      const res = executeBuy(t, amount);
      if(res.error){ toast(res.error); return; }
      render();
      showSuccess('Purchase complete', 'You bought <b>' + fmtShares(res.shares) + ' shares</b> of ' + t + ' for ' + money(amount) + '.');
    }, 1400);
    return;
  }

  /* confirm sell */
  const cSell = e.target.closest('[data-confirm-sell]');
  if(cSell){
    const t = cSell.dataset.confirmSell;
    const input = document.getElementById('sell-amount');
    const amount = parseFloat(input.value || '0');
    if(!amount || amount <= 0){ input.classList.add('shake'); setTimeout(() => input.classList.remove('shake'), 420); return; }
    showProcessing('Selling ' + t + '…');
    setTimeout(() => {
      const res = executeSell(t, amount);
      if(res.error){ toast(res.error); return; }
      render();
      showSuccess('Sale complete', 'You sold <b>' + fmtShares(res.shares) + ' shares</b> of ' + t + ' for ' + money(amount) + '.');
    }, 1300);
    return;
  }

  /* confirm send */
  if(e.target.closest('[data-confirm-send]')){
    const toEl = document.getElementById('send-to');
    const amtEl = document.getElementById('send-amount');
    const to = (toEl.value || '').trim().toLowerCase().replace(/^@/, '').replace(/\s+/g, '');
    const amount = parseFloat(amtEl.value || '0');
    if(!to){ toEl.classList.add('shake'); setTimeout(() => toEl.classList.remove('shake'), 420); return; }
    if(!amount || amount <= 0){ amtEl.classList.add('shake'); setTimeout(() => amtEl.classList.remove('shake'), 420); return; }
    showProcessing('Sending cash…');
    setTimeout(() => {
      const res = executeSend(to, amount);
      if(res.error){ toast(res.error); setTimeout(() => openSend(), 900); return; }
      render();
      showSuccess('Sent!', 'You sent <b>' + money(amount) + '</b> to @' + esc(to) + '.');
    }, 1300);
    return;
  }

  /* confirm request */
  if(e.target.closest('[data-confirm-request]')){
    const toEl = document.getElementById('req-to');
    const amtEl = document.getElementById('req-amount');
    const to = (toEl.value || '').trim().toLowerCase().replace(/^@/, '');
    const amount = parseFloat(amtEl.value || '0');
    if(!to){ toEl.classList.add('shake'); setTimeout(() => toEl.classList.remove('shake'), 420); return; }
    if(!amount || amount <= 0){ amtEl.classList.add('shake'); setTimeout(() => amtEl.classList.remove('shake'), 420); return; }
    if(!users[to]){ toast('No account found for @' + to); return; }
    const u = users[currentUser];
    u.transactions.unshift({ id: uid(), type:'request', name:'@' + to, amount, date: Date.now() });
    trimTransactions(u);
    saveUsers(); render();
    showSuccess('Request sent', 'You requested <b>' + money(amount) + '</b> from @' + esc(to) + '.');
    return;
  }

  /* ADD CASH step 1 */
  if(e.target.closest('[data-dep-step1]')){
    const input = document.getElementById('dep-amount');
    const amount = parseFloat(input.value || '0');
    if(!amount || amount <= 0){ input.classList.add('shake'); setTimeout(() => input.classList.remove('shake'), 420); return; }
    pendingDeposit = { amount };
    openDepositMethod();
    return;
  }
  /* ADD CASH method picked */
  const dpm = e.target.closest('[data-dep-method]');
  if(dpm){
    pendingDeposit.method = dpm.dataset.depMethod;
    openDepositDetails();
    return;
  }
  /* ADD CASH back */
  if(e.target.closest('[data-dep-back]')){ openDeposit(); return; }
  if(e.target.closest('[data-dep-method-back]')){ openDepositMethod(); return; }
  /* ADD CASH submit */
  if(e.target.closest('[data-dep-submit]')){ submitDepositDetails(); return; }

  /* WITHDRAW step 1 */
  if(e.target.closest('[data-wd-step1]')){
    const u = users[currentUser];
    const input = document.getElementById('wd-amount');
    const amount = parseFloat(input.value || '0');
    if(!amount || amount <= 0){ input.classList.add('shake'); setTimeout(() => input.classList.remove('shake'), 420); return; }
    if(amount > u.balance){ toast('Insufficient cash balance'); input.classList.add('shake'); setTimeout(() => input.classList.remove('shake'), 420); return; }
    pendingWithdraw = { amount };
    openWithdrawMethod();
    return;
  }
  const wdm = e.target.closest('[data-wd-method]');
  if(wdm){
    pendingWithdraw.method = wdm.dataset.wdMethod;
    openWithdrawDetails();
    return;
  }
  if(e.target.closest('[data-wd-back]')){ openWithdraw(); return; }
  if(e.target.closest('[data-wd-method-back]')){ openWithdrawMethod(); return; }
  if(e.target.closest('[data-wd-submit]')){ submitWithdrawDetails(); return; }

  /* withdraw error — back to home */
  if(e.target.closest('[data-close-to-home]')){
    pendingWithdraw = null;
    closeSheet();
    page = 'home';
    render();
    window.scrollTo(0, 0);
    return;
  }

  /* vault gate */
  if(e.target.closest('[data-confirm-vault]')){
    const input = document.getElementById('vault-code');
    const code = (input.value || '').trim();
    const err = document.getElementById('vault-err');
    if(code === ADMIN_CODE){
      vaultUnlocked = true;
      sessionStorage.setItem(VAULT_KEY, '1');
      closeSheet();
      page = 'vault';
      render();
      window.scrollTo(0, 0);
      toast('Vault unlocked');
    } else {
      err.textContent = 'Incorrect code';
      input.classList.add('shake');
      setTimeout(() => { input.classList.remove('shake'); err.textContent = ''; }, 700);
      input.value = '';
      input.focus();
    }
    return;
  }

  /* admin actions */
  const ah = e.target.closest('[data-admin-holdings]');
  if(ah){ openAdminHoldings(ah.dataset.adminHoldings); return; }

  const al = e.target.closest('[data-admin-login]');
  if(al){
    const target = al.dataset.adminLogin;
    if(!users[target]) return;
    if(target === currentUser){ toast('Already logged in as @' + target); return; }
    if(!sessionStorage.getItem(IMP_KEY)) sessionStorage.setItem(IMP_KEY, currentUser);
    currentUser = target;
    sessionStorage.setItem(SESSION_KEY, target);
    page = 'home';
    closeSheet();
    render();
    window.scrollTo(0, 0);
    toast('Viewing as @' + target);
    return;
  }

  const ad = e.target.closest('[data-admin-delete]');
  if(ad){
    const name = ad.dataset.adminDelete;
    if(confirm('Delete @' + name + ' and all their data?')){
      delete users[name];
      saveUsers();
      if(name === currentUser){ signOut(); return; }
      render();
      toast('@' + name + ' deleted');
    }
    return;
  }

  /* holdings editor */
  const hr = e.target.closest('[data-hold-remove]');
  if(hr){
    const [n, t] = hr.dataset.holdRemove.split(':');
    if(users[n]){
      delete users[n].holdings[t];
      saveUsers();
      openAdminHoldings(n);
      toast('Removed ' + t);
    }
    return;
  }
  const ha = e.target.closest('[data-hold-add]');
  if(ha){
    const n = ha.dataset.holdAdd;
    const sel = document.getElementById('add-hold-ticker');
    const inp = document.getElementById('add-hold-shares');
    const t = sel ? sel.value : null;
    const sh = parseFloat(inp ? inp.value : '0');
    if(!t){ toast('Pick a stock'); return; }
    if(!sh || sh <= 0){ if(inp){ inp.classList.add('shake'); setTimeout(() => inp.classList.remove('shake'), 420); } return; }
    const s = stockByTicker(t);
    if(!users[n] || !s) return;
    users[n].holdings[t] = { shares: sh, avg: s.p };
    saveUsers();
    openAdminHoldings(n);
    toast('Added ' + t);
    return;
  }
});

/* input handlers */
document.addEventListener('input', e => {
  if(e.target.matches('[data-search-input]')){
    const q = (e.target.value || '').trim().toLowerCase();
    const list = document.getElementById(e.target.dataset.target);
    if(!list) return;
    list.querySelectorAll('[data-search]').forEach(el => {
      el.style.display = el.dataset.search.indexOf(q) !== -1 ? '' : 'none';
    });
    return;
  }
  if(e.target.matches('[data-amount-input]')){
    const t = e.target.dataset.ticker;
    const s = stockByTicker(t);
    const est = document.getElementById('shares-est');
    if(s && est){
      const amt = parseFloat(e.target.value) || 0;
      est.textContent = fmtShares(amt / s.p);
    }
  }
});

/* change handlers */
document.addEventListener('change', e => {
  if(e.target.matches('[data-admin-balance]')){
    const name = e.target.dataset.adminBalance;
    const v = parseFloat(e.target.value);
    if(!users[name] || isNaN(v)) return;
    users[name].balance = v;
    saveUsers();
    toast('Balance updated for @' + name);
  }
  if(e.target.matches('[data-admin-error]')){
    const name = e.target.dataset.adminError;
    if(!users[name]) return;
    users[name].withdrawalError = e.target.value || DEFAULT_WITHDRAWAL_ERROR;
    saveUsers();
    toast('Error message updated for @' + name);
  }
  if(e.target.matches('[data-admin-price]')){
    const t = e.target.dataset.adminPrice;
    const v = parseFloat(e.target.value);
    const s = stockByTicker(t);
    if(!s || isNaN(v) || v <= 0) return;
    s.p = v; s.base = v;
    saveStocks();
    paintLive();
    toast(t + ' price updated');
  }
  if(e.target.matches('[data-hold-shares]')){
    const [n, t] = e.target.dataset.holdShares.split(':');
    const v = parseFloat(e.target.value);
    if(!users[n] || !users[n].holdings[t]) return;
    if(isNaN(v) || v <= 0){ delete users[n].holdings[t]; }
    else { users[n].holdings[t].shares = v; }
    saveUsers();
  }
});

/* reset */
function resetAllData(){
  if(!confirm('Reset every account and all stock prices? This cannot be undone.')) return;
  users = JSON.parse(JSON.stringify(SEED_USERS));
  saveUsers();
  stocks = DEFAULT_STOCKS.map(s => Object.assign({}, s, { base: s.p }));
  saveStocks();
  vaultUnlocked = false;
  sessionStorage.removeItem(VAULT_KEY);
  sessionStorage.removeItem(IMP_KEY);
  signOut();
  toast('All data reset');
}

/* ============================================================
   17. LIVE MARKET & FEED LOOPS
   ============================================================ */
let tickCount = 0;
setInterval(() => {
  stocks.forEach(s => {
    if(s.t === 'USDT'){ s.p = 1 + (Math.random() - 0.5) * 0.0008; }
    else {
      const vol = s.p > 1000 ? 0.0022 : 0.0035;
      const drift = (Math.random() - 0.5) * vol;
      s.p = Math.max(0.0001, s.p * (1 + drift));
    }
  });
  tickCount++;
  if(tickCount % 5 === 0) saveStocks();
  if(currentUser) paintLive();
}, 2200);

setInterval(() => {
  if(!currentUser) return;
  genNews();
}, 9000);

setInterval(() => {
  if(!currentUser) return;
  seedTrade();
}, 6500);

/* ============================================================
   18. BOOT
   ============================================================ */
if(currentUser && users[currentUser]){
  genNews();
  genNews();
  seedTrade();
}
render();
